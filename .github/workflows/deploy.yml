# Tests every PR, and ships main to cutline-app.com (Fly app cutline-b1svdw) on every push to main.
# Needs one repository secret, FLY_API_TOKEN (see DEPLOY.md, "Automatic deploys").
name: Deploy to Fly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation2
      - run: pip install '.[web,transcribe,dev]'
      - run: cd scratch && bash ffexp.sh
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy (skipped when FLY_API_TOKEN isn't set; Fly's own GitHub integration may deploy main instead)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::No FLY_API_TOKEN secret, so this workflow didn't deploy (see DEPLOY.md)"; exit 0
          fi
          flyctl deploy --remote-only --env CUTLINE_VERSION=${{ github.sha }}

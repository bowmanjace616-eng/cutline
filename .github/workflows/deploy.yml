# Ships main to cutline-app.com (Fly app cutline-b1svdw) on every push to main.
# Needs one repository secret, FLY_API_TOKEN (see DEPLOY.md, "Automatic deploys").
name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation2
      - run: pip install '.[web,transcribe,dev]'
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check the token is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add a FLY_API_TOKEN repository secret first (see DEPLOY.md)"; exit 1
          fi
      - run: flyctl deploy --remote-only --env CUTLINE_VERSION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

# fly.toml app configuration file generated for cutline on 2026-11-24T02:44:20Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'cutline'
primary_region = 'iad'

[build]
[env]
  CUTLINE_HOME = '/data'
  CUTLINE_MAX_JOBS = '1'
  CUTLINE_MAX_UPLOAD_MB = '2048'
  CUTLINE_RETENTION_DAYS = '7'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

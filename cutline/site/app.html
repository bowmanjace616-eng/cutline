<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cutline · Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffd400'/%3E%3Cpath d='M15 -2 L21 34' stroke='%230b0b0f' stroke-width='5'/%3E%3C/svg%3E">
</head>
<body class="app">

<nav class="nav">
  <div class="wrap wide">
    <a class="logo" href="/"><span class="logo-mark"></span>Cutline</a>
    <div class="nav-links">
      <span class="proj-name" id="proj-name"></span>
      <button class="btn sm" id="new-btn" hidden>New video</button>
    </div>
  </div>
</nav>

<!-- Upload -->
<main id="upload-view" class="wrap upload-view">
  <h1>Upload a video</h1>
  <p class="sub">Talking-head videos, podcasts and vlogs work best. You'll get a clean long cut and captioned Shorts.</p>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm,.mp4,.mov,.m4v,.mkv,.webm" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
    <strong>Drop your video here</strong>
    <span>or click to choose · MP4, MOV, MKV, WebM</span>
    <div class="bar" id="up-bar" hidden><i></i></div>
  </label>
  <div class="options">
    <label>Shorts <select id="opt-shorts"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
    <label>Captions <select id="opt-captions"><option value="bold">Bold</option><option value="karaoke">Karaoke</option><option value="clean">Clean</option></select></label>
  </div>
  <div class="form-msg err" id="up-msg" role="status"></div>
  <div class="recent" id="recent"></div>
</main>

<!-- Editor -->
<main id="editor-view" class="editor" hidden>
  <section class="stage">
    <div class="tabs" id="tabs"></div>
    <div class="player">
      <video id="video" controls playsinline></video>
      <div class="empty" id="player-empty">
        <div class="spinner" id="spinner"></div>
        <p id="player-msg">Your edit will show up here.</p>
      </div>
    </div>
    <div class="row-between">
      <div class="stats" id="stats"></div>
      <a class="btn sm" id="download" hidden download>Download</a>
    </div>
    <div class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
  </section>

  <aside class="chat">
    <div class="chat-head">
      <strong>Edit by chatting</strong>
      <span class="muted" id="chat-note"></span>
    </div>
    <div class="messages" id="messages">
      <div class="hint" id="chat-hint">
        <p>Tell Cutline what to change. For example:</p>
        <button class="chip">Cut the part where I talk about the sponsor</button>
        <button class="chip">Give me 2 more Shorts about the main tip</button>
        <button class="chip">Switch the captions to karaoke style</button>
        <button class="chip">Leave a bit more pause between sentences</button>
      </div>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask for an edit…"></textarea>
      <button class="btn primary sm" id="send" type="submit">Send</button>
    </form>
  </aside>
</main>

<script src="static/app.js"></script>
</body>
</html>

[project]
name = "talkcut"
version = "0.1.0"
description = "Edit long videos and make Shorts by talking to Claude."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "mcp>=2.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
talkcut = "talkcut.cli:main"
talkcut-mcp = "talkcut.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["talkcut"]

[project]
name = "cutline"
version = "0.1.0"
description = "Edit long videos and make Shorts by talking to Claude."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "mcp>=2.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
web = ["anthropic>=2.0", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cutline = "cutline.cli:main"
cutline-mcp = "cutline.server:main"
cutline-web = "cutline.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cutline"]

[tool.setuptools.package-data]
cutline = ["site/*", "site/media/*"]
